# SonarQube Cloud analysis, run by the Security workflow (.github/workflows/security.yaml).
sonar.organization=w0rkspace
sonar.projectKey=w0rkspace_portfolio-panel
sonar.projectName=portfolio-panel

# Tests live next to the code (**/*.test.ts, **/*.test.tsx) and shared test helpers in test/.
sonar.sources=app,components,lib,proxy.ts
sonar.tests=app,components,lib,test,proxy.test.ts
sonar.exclusions=**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The scan fails when the Quality Gate does not pass.
sonar.qualitygate.wait=true
